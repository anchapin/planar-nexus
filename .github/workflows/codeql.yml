# CodeQL Static Application Security Testing (SAST)
# Triggers: PR (main/develop), push (main/develop), weekly schedule, manual.
# Scans the TypeScript codebase and the GitHub Actions workflow files themselves.
# Resolves #1110.

name: CodeQL

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '**/docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '**/docs/**'
      - 'LICENSE'
      - '.editorconfig'
  schedule:
    # Weekly: Mondays at 04:27 UTC (offset to avoid GitHub-side top-of-hour load).
    - cron: '27 4 * * 1'
  workflow_dispatch:

# Minimal least-privilege scope required by the CodeQL Action.
permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Skip Dependabot PRs so dependency-bump PRs are never blocked by CodeQL.
    # Dependabot bumps are still covered by the weekly scheduled scan of main.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript -> app code (URL importers, P2P, card parsing).
        # actions              -> this and other workflow files.
        language: [javascript-typescript, actions]
    steps:
      - name: Setup repository
        # Issue #1923: bootstrap via the repo-standard composite (Node 22 +
        # npm ci) instead of a direct actions/setup-node call. The composite
        # also configures git and checks out the repo, which both matrix
        # legs need; the JS toolchain it installs feeds autobuild on the
        # javascript-typescript leg.
        uses: ./.github/actions/setup-node-npm-ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

name: Mutation Testing

# Per-module mutation-testing gate for the rules-engine invariants (#1097,
# #1265, #1395, #1597, #1717, #1762, #1785). Stryker mutates every module in
# the `mutate` allowlist in stryker.config.js and reports the aggregate
# mutation score, gated two ways:
#   1. `thresholds.break` in stryker.config.js (AGGREGATE score, enforced by
#      Stryker's own exit code), and
#   2. `scripts/mutation-floor.js` (issue #1598) — a PER-MODULE floor from
#      scripts/mutation-floor.config.js, so a single module cannot regress
#      silently while the weighted aggregate still clears `break`.
#
# Issue #1785: the previous single-job run (one Stryker invocation that
# mutated all seven allowlisted modules serially in the default 6h window)
# had not succeeded in twelve scheduled runs as of 2026-09-15 — every run
# either hit GitHub Actions' 6h job timeout with the suite only ~66%
# completed, or was cancelled by the next schedule fire. Six of the seven
# rules-engine modules therefore had NO enforced mutation-score gate at all
# (the per-PR gate covers only the config wiring, not actual scores — see
# the `mutation-smoke` job in .github/workflows/ci.yml).
#
# Fix (#1785): each allowlisted module runs in its OWN matrix job against
# the per-module npm script (`npm run mutate:<module>`), with a 90-minute
# per-job timeout, fail-fast disabled so a single bad module doesn't drag
# the others down, and a workflow-level queue (no cancel-in-progress) so a
# slow nightly run cannot be cancelled by a manual rerun mid-way. Either
# gate failure still fails its job and surfaces the offending module on the
# Actions tab + the per-module `mutation-report-<module>` artifact.
#
# The allowlist grew from 3 → 5 modules in #1395 (added trigger-system.ts and
# state-based-actions.ts), from 5 → 6 in #1597 (added combat.ts, CR 506-510),
# and from 6 → 7 in #1717 (added mana.ts, CR 106 mana pools / CR 305 lands).
# Issue #2186: added keyword-actions/ and oracle-text-parser/abilities.ts to
# Stryker mutation coverage (9-module allowlist = 7 active + 2 excluded:
# combat + keyword-actions directory). keyword-actions/ handles MTG keyword
# abilities and actions (destroy, exile, sacrifice, etc.). abilities.ts handles
# ability word parsing in oracle-text-parser. combat.ts is EXCLUDED from the
# nightly matrix (takes >40 min per run on a 4-core runner — too slow for any
# per-PR gate; its combat.mutation.test.ts remains in place for manual/local
# runs).
# `break` is currently 44 (issue #1939: lowered from 50 after trigger-system
# measured 45.00% — zero-coverage debt from #1524/#1528 pending test
# backfill); it is raised to 70 once the nightly run confirms
# every allowlisted module clears 70% killed (issue #1785 follow-up, gated
# by scripts/check-mutation-docs-sync.mjs).
#
# Issue #1762: this nightly run is the ONLY mutation-score gate. The former
# per-PR `Mutation Test (layer-system)` job in .github/workflows/ci.yml was
# the CI long pole (~2.5-3h per PR with 3x variance on identical code) and
# blocked every merge via `build.needs`. ci.yml now runs only the ~50ms
# config guard `scripts/check-mutation-config.mjs` (job `mutation-smoke`),
# which asserts the markers that keep this nightly-only tradeoff safe: the
# 7-module allowlist, a per-module floor for every allowlisted entry,
# pinned Stryker concurrency, and this workflow's schedule + gates.
#
# Run locally instead with:  npm run test:mutation
# Run a single module fast:  npm run mutate:<module>

on:
  schedule:
    # 03:17 UTC daily — off-peak, avoids the top-of-the-hour GH runner rush.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      module:
        description: >-
          Module to mutate (default: all). Use this to rerun a single
          per-module job after a flaky failure without re-running the whole
          nightly suite (issue #1785 acceptance criterion 1: "use
          workflow_dispatch to re-run a single module's job").
        required: false
        type: choice
        default: all
        options:
          - all
          - layer-system
          - replacement-effects
          - spell-casting
          - trigger-system
          - state-based-actions
          - mana
          - keyword-actions
          - oracle-text-parser-abilities

# Queue concurrent triggers (nightly + manual dispatch landing together)
# instead of cancelling: a half-finished mutation run is still signal, and
# killing it would lose the per-module scores already produced (#1785
# rationale mirrors the flake-detector policy in ci.yml, #1599).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation:
    name: Stryker (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Per-job timeout (issue #1785): one module at a time, 180 minutes —
    # observed on the GitHub-hosted 2-core runner that the prior 6h
    # nightly runs had been hitting: a single layer-system.ts Stryker
    # run consumed the full 90-minute budget in the first manual
    # dispatch (run 35165289073, cancelled at 01:38:31Z after starting
    # 00:08:56Z) without producing a report, because the file's mutants
    # + the perTest test-suite fanout outpace the 90-min cap on this
    # runner class. 180 min is well under GitHub Actions' 6h job cap
    # and bounds the slowest module (layer-system) at ~3h; the five
    # lighter modules are expected to clear in 30-60 min.
    # The first green nightly run will record measured runtimes per
    # module and a follow-up PR can tighten this back toward 90 min
    # for the lighter entries if it becomes a budget concern.
    #
    # Raised 180 -> 360 on 2026-10-23 (issue #1785 acceptance criterion
    # "make the nightly run complete within its budget"). Measured on run
    # 39990082229, which had ignoreStatic enabled and still timed every
    # leg out at 180 min. Per-mutant cost is dominated by the mutants
    # that hang a covering test (55-92% of mutants in the timeout-heavy
    # modules), so the throughput is roughly:
    #
    #   state-based-actions  321 runnable mutants x 23.8 s = 2.1 h
    #   combat               454 runnable mutants x 15.0 s = 1.9 h
    #   replacement-effects  724 runnable mutants x 14.9 s = 3.0 h
    #   mana                 773 runnable mutants x 16.8 s = 3.6 h
    #   layer-system         752 runnable mutants x 20.8 s = 4.3 h
    #   trigger-system     1,450 runnable mutants x 13.7 s = 5.5 h
    #   oracle-abilities     935 runnable mutants x 22.4 s = 5.8 h
    #   spell-casting      2,516 runnable mutants x 11.0 s = 7.7 h  <- still over
    #   keyword-actions    7,966 runnable mutants x  6.3 s = 13.9 h  <- still over
    #
    # 360 min is the ceiling GitHub-hosted runners allow. The last two
    # modules still need to be split into per-file legs (spell-casting in
    # two, keyword-actions in four) — see the handoff at
    # .planning/handoffs/planar-nexus-mutation-gate-static-mutants-2026-10-23.md
    # for the exact partitioning and the per-leg uncovered-mutant budgets
    # that go with it.
    timeout-minutes: 360
    strategy:
      # `fail-fast: false` (issue #1785 acceptance criterion 1): one slow
      # or hung module must not abort the others. With fail-fast enabled,
    # a hung layer-system job would cancel the still-running
    # job and we'd lose its score — the exact regression this fix is
      # supposed to surface. Matrix entries are the canonical 7-module
      # allowlist; `workflow_dispatch` overrides via the `inputs.module`
      # choice so a single module can be re-run on demand.
      fail-fast: false
      matrix:
        module: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' &&
            github.event.inputs.module != 'all' &&
            format('["{0}"]', github.event.inputs.module) ||
            '["layer-system","replacement-effects","spell-casting","trigger-system","state-based-actions","combat","mana","keyword-actions","oracle-text-parser-abilities"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
        with:
          # Nine matrix legs run `npm ci` in parallel. The setup-node npm
          # tarball cache is a known intermittent failure point there
          # ("Failed to recover package-lock.json" — it killed the combat leg
          # of run 39990082229 after 2.5 minutes). The composite caches
          # node_modules itself, so the tarball cache buys nothing here.
          npm-cache: 'false'

      - name: Generate card-script index
        # `src/lib/game-state/card-scripts/cards/index.generated.ts` is a
        # generated artifact and is gitignored, but `jest.setup.js` requires it
        # at test-setup time. Stryker's initial dry run boots the whole Jest
        # suite, so without this step every matrix leg aborts within ~80s on
        # `MODULE_NOT_FOUND: Cannot find module
        # './src/lib/game-state/card-scripts/cards/index.generated'`
        # (nightly runs 39570472965 / 39394365992 / 39226161901, all 9 legs).
        # The generator is idempotent and self-skipping, so this is cheap when
        # the file already exists. Must run before the Stryker step below.
        run: npx tsx scripts/build-card-script-index.ts

      - name: Run Stryker mutation testing (${{ matrix.module }})
        # Issue #1785 acceptance criterion 1: per-module job calling
        # `npm run mutate:<module>` with a generous timeout (180 min —
        # see the job-level `timeout-minutes` above). Using the existing
        # per-module npm scripts keeps the local-dev workflow identical
        # (`npm run mutate:layer-system` etc.) so the per-PR config guard
        # `scripts/check-mutation-config.mjs` (`mutation-smoke` job) keeps
        # asserting the same wiring markers (#1762 + #1785).
        run: npm run mutate:${{ matrix.module }}
        env:
          # Pinned (issue #1762): an unset worker count tracks runner CPU
          # count and produced 59↔184 min variance. The GitHub-hosted
          # ubuntu-latest runner is 2-core, so 4 workers is the same
          # oversubscription the full-allowlist run used; raising it
          # would only add scheduler contention. The 180-min timeout is
          # what absorbs the slow mutants the full run used to spread
          # across six modules.
          STRYKER_CONCURRENCY: 4

      - name: Per-module score breakdown
        # Issue #1395: surface a per-module mutation-score table on the
        # Actions summary so a future regression identifies WHICH module
        # slipped below the gate, not just the aggregate score. With
        # per-module jobs (#1785) each summary contains exactly one module,
        # which is fine — the per-module `mutation-report-<module>`
        # artifact carries the full JSON.
        if: always()
        run: node scripts/mutation-summary.js

      - name: Enforce per-module mutation-score floor
        # Issue #1598: the aggregate `thresholds.break` gate cannot catch
        # a single module regressing. This gate parses the same per-module
        # report and fails the job if the mutated module drops below its
        # floor in scripts/mutation-floor.config.js. With per-module jobs
        # (#1785) the report contains exactly one module, so the per-module
        # floor is the only meaningful check — Stryker's own `break` gate
        # is a no-op on a single-module run (an aggregate of one is itself).
        if: always()
        run: node scripts/mutation-floor.js

      - name: Upload mutation report (${{ matrix.module }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.module }}
          path: reports/mutation/
          retention-days: 30

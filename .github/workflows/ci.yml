name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Daily scheduled run so new npm advisories are caught between PRs (#1108)
  # and the Playwright flake-detector runs nightly (#1599). On the schedule
  # only the `security`/`cargo-audit` audits, the `flake-detector` (#1599),
  # the `cross-browser-e2e` (#1595), and the `jest-flake-detector` (#1719)
  # jobs run; every other job is gated
  # with `if: github.event_name != 'schedule'` to skip this trigger.
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Run unit tests with coverage
        # Issue #1719: --forceExit was removed — it masked hanging timers
        # and unresolved handles (the CI-only #1634 coach-conversation
        # failures) by force-killing the process instead of failing. The
        # suite now must exit cleanly on its own; a hanging handle fails
        # this job (and is surfaced by the nightly jest-flake-detector
        # below as a wall-clock timeout) instead of being silently hidden.
        run: npm test -- --coverage --ci --maxWorkers=2 --workerIdleMemoryLimit=512MB
      
      - name: QA coverage gate (#1394)
        run: node scripts/qa-coverage-gate.js
      
      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck]
    # Issue #1433: engage the Tauri dev-fallback shim so the desktop code
    # paths are taken against the dev server. The flag is a build-time
    # NEXT_PUBLIC_* value inlined by Next, so it must be present in the env
    # that boots `npm run dev` (Playwright's webServer inherits this env).
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium
      
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  flake-detector:
    # Issue #1264: nightly Playwright flake-detector. Runs the suite 5×
    # with `--retries=0` and fails if any spec passes <4/5. Posted as a
    # PR comment when flakes are found, so engineers see the signal
    # without browsing to the Actions tab. Slow (~30 min for the full
    # chromium suite × 5) so it runs nightly (#1599), on every push to
    # main, and on manual dispatch — never on PRs or develop pushes.
    name: Flake Detector (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Issue #1599: a half-finished flake run reports a false negative, so
    # never cancel an in-flight detector run — queue concurrent triggers
    # (nightly + push-to-main landing at the same time) instead.
    concurrency:
      group: ${{ github.workflow }}-flake-detector
      cancel-in-progress: false
    # Mirror the e2e job's Tauri dev-fallback flag (#1433) so the nightly
    # flake run exercises the same desktop path and doesn't false-positive.
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Run flake detector (5 runs, threshold 4)
        id: flake
        # Capture the exit code; an infra failure must still upload the
        # partial report so the PR comment is useful.
        run: |
          set +e
          npm run test:e2e:flake
          FLAKE_EXIT=$?
          echo "flake-exit=$FLAKE_EXIT" >> "$GITHUB_OUTPUT"
          exit $FLAKE_EXIT
        env:
          CI: 'true'

      - name: Upload flake report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-detector-report
          path: reports/flake-detector/
          retention-days: 90

      - name: Post PR comment with flake report
        if: github.event_name == 'schedule' && steps.flake.outputs.flake-exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Flakes concern the codebase, not a single PR — surface them on
        # every open PR that targets the default branch. Use a hidden
        # marker so re-runs do not duplicate the comment.
        run: |
          set -e
          if [ ! -f reports/flake-detector/report.md ]; then
            echo "No flake report present; skipping PR comment."
            exit 0
          fi
          BASE="${GITHUB_BASE_REF:-main}"
          for pr in $(gh pr list --state open --base "$BASE" --json number --jq '.[].number'); do
            gh pr comment "$pr" --body-file reports/flake-detector/report.md || true
          done

  jest-flake-detector:
    # Issue #1719: nightly Jest flake-detector — the unit-suite counterpart
    # of the Playwright flake-detector job above (#1264). The merge-gating
    # Test job runs the suite once, so a test that passes 4 of 5 times is
    # invisible to it (and --forceExit used to mask the hanging handles
    # that make CI-only failures like #1634 materialize). This job runs the
    # suite 5x with a distinct --randomize seed per run (order-dependent
    # state bleed surfaces) and fails if any test passes <4/5 — the same
    # visibility contract as the Playwright detector: Actions summary,
    # 90-day report artifact, and a PR comment when flakes are found.
    name: Flake Detector (Jest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The PR-comment step below posts the flake report on open PRs.
      pull-requests: write
    # Same policy as the Playwright detector (#1599): a half-finished
    # flake run reports a false negative, so queue concurrent triggers
    # instead of cancelling.
    concurrency:
      group: ${{ github.workflow }}-jest-flake-detector
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run Jest flake detector (5 runs, threshold 4, no --forceExit)
        id: jestflake
        # Capture the exit code; an infra failure must still upload the
        # partial report so the PR comment is useful.
        run: |
          set +e
          npm run test:flake
          FLAKE_EXIT=$?
          echo "flake-exit=$FLAKE_EXIT" >> "$GITHUB_OUTPUT"
          exit $FLAKE_EXIT
        env:
          CI: 'true'

      - name: Upload Jest flake report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-flake-detector-report
          path: reports/jest-flake-detector/
          retention-days: 90

      - name: Post PR comment with Jest flake report
        if: github.event_name == 'schedule' && steps.jestflake.outputs.flake-exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Flakes concern the codebase, not a single PR — surface them on
        # every open PR that targets the default branch (same contract as
        # the Playwright detector above).
        run: |
          set -e
          if [ ! -f reports/jest-flake-detector/report.md ]; then
            echo "No flake report present; skipping PR comment."
            exit 0
          fi
          BASE="${GITHUB_BASE_REF:-main}"
          for pr in $(gh pr list --state open --base "$BASE" --json number --jq '.[].number'); do
            gh pr comment "$pr" --body-file reports/jest-flake-detector/report.md || true
          done

  
  cross-browser-e2e:
    # Issue #1595: nightly cross-browser E2E gate. playwright.config.ts
    # declares chromium/firefox/webkit, but the per-PR e2e job above runs
    # --project=chromium only, so firefox/webkit specs never executed and a
    # browser-specific divergence (focus behavior, ResizeObserver /
    # MutationObserver scheduling, webkit strict Intl locale handling)
    # regressed silently. This job mirrors the flake-detector nightly
    # pattern above: schedule + workflow_dispatch + push-to-main — never on
    # PRs, so per-PR CI keeps running ONLY --project=chromium (#1595
    # acceptance criterion 4: keeps PR CI under budget).
    #
    # Tolerance note: the E2E dev-server boot breakage tracked by #1625 is
    # resolved, and the #1705 engine mix-up (firefox/webkit projects
    # defaulting to chromium and demanding `chromium_headless_shell`, which
    # this job does not install) is fixed via `browserName` in
    # playwright.config.ts. Per #1595's acceptance criterion 3 the run must
    # exit non-zero on any firefox/webkit spec failure, so there is
    # deliberately NO continue-on-error here: the job is nightly/manual-only
    # and is not in the `build` job's needs list, so a red run is a signal,
    # not a merge blocker.
    name: Cross-Browser E2E (firefox + webkit)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Queue concurrent triggers (nightly + manual dispatch landing together)
    # instead of cancelling: a half-finished cross-browser run is still signal.
    concurrency:
      group: ${{ github.workflow }}-cross-browser-e2e
      cancel-in-progress: false
    # Mirror the e2e job's Tauri dev-fallback flag (#1433) so this run
    # exercises the same desktop code path as the per-PR chromium run.
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Distinct key prefix, NOT the `playwright-*` key the chromium e2e
          # job uses (#1595): that cache holds chromium only, so restoring it
          # here would mark a cache hit and skip the firefox/webkit install
          # below. Same lockfile-hash pattern, separate browser set.
          key: playwright-crossbrowser-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # #1705: this run executes ONLY the firefox and webkit projects
        # (playwright.config.ts pins their `browserName`), so firefox +
        # webkit + ffmpeg (auto-included for any browser argument) is the
        # complete binary set. chromium and chromium_headless_shell are
        # deliberately NOT installed: if a future config/fixture regresses
        # to the default chromium engine, the run must fail loudly here
        # with `Executable doesn't exist ... chromium_headless_shell`
        # instead of silently testing chromium a second time.
        run: npx playwright install --with-deps firefox webkit

      - name: Install Playwright OS dependencies
        # Unconditional twin of the cache-miss install above (same pattern as
        # the chromium e2e job): --with-deps only runs on a cache miss, so
        # this step keeps OS libs current when the browser cache is a hit.
        run: npx playwright install-deps firefox webkit

      - name: Run Playwright tests (firefox + webkit)
        id: crossbrowser
        env:
          CI: 'true'
          # JSON reporter output feeds the per-project summary table below;
          # HTML goes to the same folder the per-PR e2e job uploads.
          PLAYWRIGHT_JSON_OUTPUT_DIR: reports/cross-browser
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        # Capture the exit code so the summary/report steps below can run
        # `if: always()`, then re-exit non-zero: any firefox/webkit failure
        # must fail the workflow (#1595 acceptance criterion 3).
        run: |
          set +e
          mkdir -p reports/cross-browser
          npx playwright test --project=firefox --project=webkit --reporter=list,json,html
          CROSS_EXIT=$?
          echo "test-exit=$CROSS_EXIT" >> "$GITHUB_OUTPUT"
          exit "$CROSS_EXIT"

      - name: Per-project summary (#1595)
        if: always()
        run: |
          set -e
          python3 - <<'PY'
          import json, os

          results_path = "reports/cross-browser/results.json"
          buckets = ("passed", "failed", "flaky", "skipped")
          mapping = {"expected": "passed", "unexpected": "failed", "flaky": "flaky", "skipped": "skipped"}
          counts = {}

          def walk(suite):
              for spec in suite.get("specs") or []:
                  for test in spec.get("tests") or []:
                      yield test
              for child in suite.get("suites") or []:
                  yield from walk(child)

          try:
              with open(results_path, encoding="utf-8") as fh:
                  data = json.load(fh)
              for project_suite in data.get("suites") or []:
                  for test in walk(project_suite):
                      project = test.get("projectName") or "unknown"
                      status = mapping.get(test.get("status"), "failed")
                      row = counts.setdefault(project, {b: 0 for b in buckets})
                      row[status] = row.get(status, 0) + 1
          except (OSError, ValueError):
              counts = {}

          lines = ["### Cross-browser E2E (#1595) - per-project results", ""]
          if counts:
              lines.append("| Project | Passed | Failed | Flaky | Skipped |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for project in sorted(counts):
                  row = counts[project]
                  values = (row.get(b, 0) for b in buckets)
                  lines.append("| {} | {} | {} | {} | {} |".format(project, *values))
          else:
              lines.append("_No per-project report was produced - the run failed before any test")
              lines.append("completed (e.g. the dev-server boot failure tracked in #1625). Check the job log._")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-firefox-webkit
          path: |
            playwright-report/
            reports/cross-browser/
          retention-days: 30

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots-firefox-webkit
          path: test-results/
          retention-days: 7

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run ESLint
        run: npm run lint

  a11y-contrast:
    name: A11y Color Contrast
    # WCAG 1.4.3 / 1.4.11 design-token audit (#1268). Runs scripts/check-color-contrast.ts
    # which parses `src/app/globals.css`, computes WCAG contrast ratios for every
    # documented foreground/background pair, and fails the build if any pair drops
    # below the AA threshold. Also regenerates docs/CONTRAST_AUDIT.md and uploads
    # it as a workflow artifact so reviewers can read the latest numbers without
    # checking out the branch.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Audit design-token contrast (WCAG 1.4.3 / 1.4.11)
        run: npm run a11y:contrast:report

      - name: Upload contrast audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-audit-report
          path: docs/CONTRAST_AUDIT.md
          retention-days: 30
  
  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Run TypeScript type check
        run: npm run typecheck

  commitlint:
    name: Commit Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: npx commitlint --last --verbose

  mutation-smoke:
    # Issue #1762: the former `Mutation Test (layer-system)` Stryker job was
    # the CI long pole — ~2.5-3h per PR with 3x variance on identical code
    # (59 vs 184 min runs of the same branch content, see #1762's duration
    # table) — and `build` depended on it, so every PR merge waited on it.
    # Stryker is now OFF the per-PR path entirely: layer-system is gated by
    # the NIGHTLY .github/workflows/mutation.yml run, which already mutates
    # it (it is in the `mutate` allowlist) and enforces both the aggregate
    # `thresholds.break` and the per-module floor (55, via
    # scripts/mutation-floor.js).
    #
    # Accepted tradeoff (#1762): a layer-system mutation-score regression
    # surfaces on the nightly run (≤24h detection latency on main) instead
    # of blocking the PR that introduced it; in exchange per-PR CI drops
    # its single ~3h job and stops tracking Stryker/runner variance. This
    # guard keeps the move honest (~50ms): it fails the PR if any marker
    # that makes the nightly-only gate safe is removed — the 6-module
    # allowlist, per-module floors for every entry, pinned Stryker
    # concurrency, the nightly schedule + gates, and "no Stryker in ci.yml".
    # Local equivalent: npm run lint:mutation-config.
    name: Mutation Config Guard (#1762)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert nightly mutation gate wiring (#1762)
        run: node scripts/check-mutation-config.mjs

  security:
    name: Security Audit (npm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run npm audit
        # Fail on high/critical advisories. Previously `critical`, which let
        # every high/moderate advisory pass CI silently (#1108).
        run: npm audit --audit-level=high

  # Mirror of the `security` job for the Rust crate tree consumed by the Tauri
  # host at `src-tauri/`. Tauri 2 desktop bundles statically link Rust crates,
  # so CVEs in any of them ship into the installer. Resolves #1275.
  cargo-audit:
    name: Security Audit (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Configure git
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit install
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-v0.22

      - name: Install cargo-audit
        # `--locked` makes the toolchain installer pick the exact version
        # referenced in cargo-audit's own Cargo.toml, matching the homebrew
        # release that the docs runbook recommends.
        run: cargo install cargo-audit --locked --version ^0.22 --force

      - name: Run cargo audit
        working-directory: src-tauri
        # Gate on the parsed JSON severity only (>= high), per #1763:
        # `cargo audit` exits 1 whenever ANY advisory is listed,
        # regardless of severity, so passing that code through would fail
        # the job on sub-high and unrated advisories and defeat the
        # severity gate. Warnings (unmaintained/unsound/notice) and
        # sub-high advisories are surfaced but not gated here so the
        # inherited gtk-rs GTK3 binders, which Tauri pulls in via `wry`
        # on Linux, do not break the build until the gtk4-rs migration
        # tracked in the roadmap lands.
        # See docs/RUST_UPGRADE_STRATEGY.md for triage details.
        run: |
          set -e
          # Exit 1 = "advisories found" (any severity) — NOT a tool error;
          # the python gate below is authoritative for severity. Exit >= 2
          # means cargo-audit itself errored (e.g. advisory-DB fetch
          # failure): fail fast with a distinct tool-failure message (#1763).
          cargo audit --json > cargo-audit.json || AUDIT_EXIT=$?
          if [ "${AUDIT_EXIT:-0}" -ge 2 ]; then
              echo "::error::cargo audit TOOL FAILURE (exit ${AUDIT_EXIT}); this is a tool error, not an advisory finding. See cargo-audit.json"
              exit "${AUDIT_EXIT}"
          fi
          python3 - <<'PY'
          import json, sys

          # Severity gate: fail only on advisories rated >= high, matching
          # the `npm audit --audit-level=high` contract from #1108 (#1763).
          order = {'low': 1, 'moderate': 2, 'medium': 2, 'high': 3, 'critical': 4}
          threshold = order['high']

          # UNRATED-SEVERITY POLICY (#1763): fresh RustSec disclosures can
          # carry an empty `severity` field (e.g. RUSTSEC-2026-0285 on day
          # one). We explicitly treat unrated as `moderate`: printed loudly
          # below, NOT gated. This fail-open choice is deliberate — the
          # triage sweep in docs/RUST_UPGRADE_STRATEGY.md re-scores them
          # once RustSec assigns a severity.
          UNRATED_AS = 'moderate'

          try:
              with open('cargo-audit.json') as fh:
                  data = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"cargo audit TOOL FAILURE: report missing or unparseable "
                    f"({exc}); this is a tool error, not an advisory finding",
                    file=sys.stderr)
              sys.exit(2)

          vulns = data.get('vulnerabilities', {}).get('list', []) or []
          failing = []
          for v in vulns:
              adv = v.get('advisory') or {}
              sev = adv.get('severity') or ''
              pkg = (v.get('package') or {}).get('name')
              ver = (v.get('package') or {}).get('version')
              aid = adv.get('id')
              title = adv.get('title')
              if sev in order:
                  rank, label = order[sev], sev
              else:
                  rank, label = order[UNRATED_AS], f'unrated, treated as {UNRATED_AS}'
              line = f"  {aid}: {pkg}@{ver} [{label}] {title}"
              if rank >= threshold:
                  failing.append(line)
              else:
                  print(f"advisory (not gated):{line}")
          if failing:
              print("cargo audit: failing advisories (severity >= high):", file=sys.stderr)
              for line in failing:
                  print(line, file=sys.stderr)
              sys.exit(1)
          print(f"cargo audit: {len(vulns)} advisories total; none at severity >= high")
          warnings = data.get('warnings') or {}
          for kind, items in warnings.items():
              print(f"  warning [{kind}]: {len(items)} (informational, not gated)")
          PY

      - name: Upload cargo-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-audit-report
          path: src-tauri/cargo-audit.json
          retention-days: 14

  # Issue #1591: fmt/clippy/test gate for the src-tauri/ Rust crate. The
  # cargo-audit job above only checks RustSec advisories; this job enforces
  # rustfmt formatting, clippy lints (`-D warnings` escalates every warning
  # to an error), and runs the Rust unit tests — including the
  # single-instance regression guard for issue #1441
  # (`single_instance_plugin_initializes_with_main_window_callback`) that
  # previously never executed in CI. Node is bootstrapped via the shared
  # composite so `npm run build` can produce the `.next` frontend dist that
  # `tauri::generate_context!()` embeds at compile time; without it both
  # clippy and test fail to compile the crate.
  rust-checks:
    name: Rust Checks (fmt, clippy, test)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Build Next.js frontend
        # tauri.conf.json sets `build.frontendDist: ../.next`, and
        # `tauri::generate_context!()` (src-tauri/src/lib.rs) embeds those
        # assets while compiling — the directory must exist for clippy and
        # test to build the crate at all.
        run: npm run build

      - name: Install Rust toolchain
        # Same action as the cargo-audit job above; adds the rustfmt and
        # clippy components this gate needs.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: rust-checks-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-checks-${{ runner.os }}-

      - name: Install Linux system dependencies
        # Same webkit/gtk dev-lib list as the Linux build job in
        # release.yml — clippy/test must link the Tauri host to compile it.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            libatk1.0-dev \
            libasound2-dev \
            libatspi2.0-dev \
            libcups2-dev

      - name: Check formatting (cargo fmt)
        # Runs first — no compilation or system deps needed, so formatting
        # drift fails fast before the expensive steps.
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint (cargo clippy, warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (cargo test)
        working-directory: src-tauri
        run: cargo test --no-fail-fast

  workflow-lint:
    # Issue #1481: standalone Workflow Lint job. Lands independently of #1438
    # so the four pre-existing workflow issues (SC2034 dead var, undeclared
    # `video-fixtures-count` output, SC2086/SC2015 info-level noise) keep
    # being caught even if the broader #1438 CI refactor is reverted.
    # actionlint ships as a single Go binary — no Node setup required.
    # shellcheck severity threshold is set to `warning` so info-level noise
    # (SC2086 double-quote-to-prevent-globbing, SC2015 `A && B || C`) does
    # not fail the build, but real warnings do.
    name: Workflow Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Issue #1550: assert that every `uses: ./.github/actions/setup-node-npm-ci`
      # caller either omits `with: node-version:` (relies on the composite
      # default '22') or specifies `'22'` (or `${{ env.NAME }}` where env.NAME
      # is `'22'` in the same file). Runs as a plain-Node script (~50ms) so
      # no Node setup step is needed — the `setup-node-npm-ci` composite
      # itself depends on this guard, so it must not be a setup step here.
      - name: Assert setup-node-npm-ci node-version consistency (#1550)
        run: node scripts/check-setup-node-npm-ci-version.mjs

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        with:
          # actionlint has no severity flag; use -ignore (regex on messages)
          # to keep SC2086 (quote vars) / SC2015 (A&&B||C) info-level nits
          # informational rather than failing the PR gate.
          args: '-ignore SC2086 -ignore SC2015'

  tauri-updater-config:
    # Issue #1430: standalone guard that prevents the Tauri 2 updater from
    # ever shipping with the empty-pubkey MITM default. The Jest suite
    # `tests/updater-wiring.test.ts` (#1403) covers the same contracts but
    # runs inside the full unit-test job; this script runs in plain Node
    # (~50ms) so a regression against `src-tauri/tauri.conf.json` fails
    # fast in its own job rather than waiting on the test suite.
    name: Tauri Updater Config Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert updater config (#1430)
        run: node scripts/check-tauri-updater-config.mjs

  engine-size-budget:
    # Issue #1725: no rules-engine module under src/lib/game-state/ may
    # exceed 2,000 lines. Issue #1808: no AI opponent/consumption
    # module under src/ai/ may exceed 3,500 lines (the ai layer is
    # structurally larger than the engine due to feature tables,
    # weight-learning stores, and model-side state translators).
    # Both gates share scripts/check-engine-size-budget.mjs and are
    # evaluated by a single Node invocation. The four top-churn
    # engine monoliths (types.ts, spell-casting.ts, oracle-text-parser.ts,
    # keyword-actions.ts) were decomposed into per-family modules in
    # #1725; this guard blocks regrowth so size × churn risk cannot
    # silently re-accumulate. Runs in plain Node (~50ms for 167 files)
    # — far cheaper than the suites that would otherwise carry the
    # signal. Local equivalent: `npm run lint:engine-size`.
    name: Engine Size Budget
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert engine/ai module size budget (#1725, #1808)
        run: node scripts/check-engine-size-budget.mjs

  no-prompt-in-engine-guard:
    # Issue #1816: keep LLM prompt text out of the rules-engine directory.
    # The engine (`src/lib/game-state/`) is exported only through its barrel
    # and is the mutation-tested correctness core; LLM prompt strings live
    # with the AI tooling (`src/ai/flows/`). Reintroducing a prompt into the
    # engine directory adds churn to the directory whose merge gate is the
    # strictest, and the engine boundary was deliberately built to exclude
    # that class of content (#1724). The script walks the engine directory
    # and exits 1 on any "You are a " / "Act as a " role-signature match.
    # Runs in plain Node (~50ms) so a regression fails fast in its own job
    # rather than waiting on the test suite. Local equivalent:
    # `npm run lint:no-prompt-in-engine`.
    name: No Prompt In Engine Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert no LLM prompt text in rules engine (#1816)
        run: node scripts/check-no-prompt-in-engine.mjs

  turn-credentials-guard:
    # Issue #1571: standalone guard that prevents private TURN credentials
    # from being committed via NEXT_PUBLIC_TURN_* env vars or inline
    # `turn:`/`turns:` URL credentials. Every `NEXT_PUBLIC_*` variable is
    # inlined into the client bundle by Next.js, so a real Coturn password
    # set in `NEXT_PUBLIC_TURN_PASS` ships to every browser/Tauri shell
    # that loads the app. The Jest suite
    # `src/lib/__tests__/ice-config.credential-leak.test.ts` (#1571)
    # covers the same contracts but runs inside the full unit-test job;
    # this script runs in plain Node (~50ms) so a regression against the
    # committed repo state fails fast in its own job rather than waiting
    # on the full test suite.
    name: Turn Credentials Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert no committed TURN credentials (#1571)
        run: node scripts/check-turn-credentials.mjs

  coverage-docs-guard:
    # Issue #1712: the coverage-floor tables in README.md, CONTRIBUTING.md,
    # and docs/TESTING.md document the CI-enforced floor from
    # jest.config.js coverageThreshold.global. The floor ratchets upward
    # automatically (scripts/ratchet-coverage.js, #1099) and had outrun the
    # hand-edited doc tables (docs said 22-29% while the enforced floor was
    # 52-60%). The ratchet now rewrites the anchored tables on every bump,
    # and this plain-Node guard (~1ms, no toolchain) fails fast when a doc
    # table is edited by hand with stale numbers, instead of waiting on the
    # full unit-test job.
    name: Coverage Docs Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert coverage-floor doc tables match jest.config.js (#1712)
        run: node scripts/check-coverage-docs-sync.mjs

  mutation-docs-guard:
    # Issue #1785: the mutation section in docs/TESTING.md documents the
    # CI-enforced aggregate floor (`stryker.config.js` thresholds.break)
    # and the per-module floors for the modules with measured baselines
    # (`layer-system.ts` at 55, `replacement-effects.ts` at 76). Those
    # numbers drift the same way the coverage floors did before #1712:
    # the nightly gate had not completed in twelve consecutive scheduled
    # runs (2026-09-04..09-15), leaving six of seven allowlisted modules
    # ungated and the documented 70% project target unverified against
    # `thresholds.break: 50`. Mirrors the coverage guard (#1712): parses
    # `thresholds.break` and the anchored table cell, parses the inline
    # "Per-module floor:" markers, and exits 1 on any drift. ~1ms plain
    # Node, no toolchain. Local equivalent: `npm run lint:mutation-docs`.
    name: Mutation Docs Guard (#1785)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert mutation-floor doc tables match stryker.config.js (#1785)
        run: node scripts/check-mutation-docs-sync.mjs

  e2e-asserts-guard:
    # Issues #1786, #1857, #1858, #1859: AST guard that keeps two vacuous
    # anti-patterns out of the e2e suite. (1) `if (await el.isVisible())`
    # around an assertion (the original #1786 bug — a blank shell could
    # pass). (2) `expect(<text>.length).toBeGreaterThan(<N>)` with N≤200
    # — the pattern PR #1853 introduced under deadline pressure and
    # Greptile flagged in P1 reviews (#1858 sealed, #1859 draft). The
    # guard walks every `.ts` and `.tsx` under e2e/ (#1857 widened the
    # filename collection from `.ts` only). Runs in plain Node (~50ms)
    # so a regression fails fast in its own job rather than waiting on
    # the e2e suite. Local equivalent: `npm run lint:e2e-asserts`.
    name: E2E Assertion Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert e2e assertion hygiene (#1786, #1857, #1858, #1859)
        run: node scripts/check-e2e-asserts.mjs

  jest-mock-boundary-guard:
    # Issue #1815: the #1710 barrel rule (eslint `no-restricted-imports`)
    # keeps production code routed through `@/lib/game-state`, but Jest's
    # `jest.mock("path")` / `jest.requireActual("path")` / dynamic
    # `import("path")` calls bypass that rule — they take string-literal
    # arguments that ESLint cannot statically analyse. The bypass is a
    # silent footgun: after an engine-internal rename (issue #1725's
    # decomposition just shipped one), a stale mock path stops
    # intercepting and the test asserts against the real implementation
    # while reporting "this was mocked". Green CI, broken code. This job
    # walks every `.test.ts(x)` under src/ and tests/ with the
    # TypeScript AST and fails when a deep engine specifier appears
    # without a corresponding allowlist entry in
    # config/jest-mock-boundary-allowlist.json. Runs in plain Node
    # (~100ms). Local equivalent: `npm run lint:jest-mock-boundary`.
    name: Jest Mock Boundary Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert no deep engine jest.mock specifiers outside the engine tree (#1815)
        run: node scripts/check-jest-mock-boundary.mjs

  bundle-size-budget:
    # Issue #1814: nothing gated the compiled client payload — a single
    # careless import could silently add hundreds of KB to a route with
    # no CI signal. This job builds the app, then fails when any route's
    # First Load JS exceeds its recorded budget in
    # config/bundle-budget.json (scripts/check-bundle-budget.mjs parses
    # the .next/ build manifests; Next 16 Turbopack prints no size
    # table, so stdout is not an option). Budgets ratchet downward only:
    # over-budget, unbudgeted-new-route, stale-entry, and
    # budget-now->10kB-too-high all fail. The full build is required to
    # measure real chunks (minutes of runtime — accepted). Local
    # equivalent: `npm run build && npm run check:bundle-budget`.
    # Intentionally NOT in the `build` job's needs-list (#1814 keeps
    # the CI graph unchanged).
    name: Bundle Size Budget
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Build application
        run: npm run build

      - name: Assert per-route First Load JS budgets (#1814)
        run: node scripts/check-bundle-budget.mjs --check

  broken-links-guard:
    # Issue #1896: prevent the link-rot class of bug that PR #1892 just
    # hand-fixed (11 broken relative links across CONTRIBUTING.md,
    # RELEASE_RUNBOOK.md, TESTING.md, DEPLOYMENT_GUIDE.md,
    # BRANCH_PROTECTION.md, and VIDEO_DERIVED_TESTS_WORKFLOW.md). The
    # script walks every `.md` under the repo root (excluding
    # `node_modules`, `.next`, `docs/implementation/`, `.planning/`,
    # and other build-output dirs) and parses both inline `[text](path)`
    # and reference-style `[text][ref]` link syntax. For each target:
    #   - external URLs (http/https/mailto/tel/file://) are skipped
    #     per the issue's "Out of scope" clause,
    #   - repo-root paths (`/docs/foo.md`) resolve against REPO_ROOT,
    #   - relative paths resolve against the source file's directory
    #     and `existsSync` the result,
    #   - an optional `#anchor` slugifies per the GFM algorithm and is
    #     checked against the target's heading slugs.
    # Exit 0/1 per the gate contract; `--json` and `--dry-run` are
    # tooling affordances. Runs in plain Node (~200ms over the 300+
    # markdown files in the repo) — fast enough to be merge-gating.
    # Local equivalent: `npm run lint:broken-links`.
    name: Broken Markdown Link Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert no broken markdown links (#1896)
        run: node scripts/check-broken-links.mjs

  test-count-docs-guard:
    # Issue #1910: the `# Full test suite` snippet in
    # docs/TEST_VIDEO_FIXTURES.md documented Jest's summary line
    # (issue #1397 commit, frozen at 380 test suites / 7867 tests).
    # Every merge added tests but the doc summary never moved, so the
    # verification block carried a number from weeks ago. Mirrors the
    # coverage-docs guard (#1712) and the mutation-docs guard (#1785):
    # `scripts/ratchet-test-count.mjs` rewrites the anchored block
    # (`<!-- TEST_COUNT:START -->` … `<!-- TEST_COUNT:END -->`) on
    # every bump; this job re-measures live Jest and fails fast when
    # the doc drifts. Runs in plain Node, with Jest as the only
    # external dependency (~80s on a warm cache). Local equivalent:
    # `npm run lint:test-count`.
    name: Test Count Docs Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert test-count doc block matches live Jest (#1910)
        run: node scripts/check-test-count-docs.mjs

  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck, commitlint, mutation-smoke, security, cargo-audit, rust-checks, a11y-contrast, e2e, workflow-lint, tauri-updater-config, engine-size-budget, no-prompt-in-engine-guard, turn-credentials-guard, coverage-docs-guard, mutation-docs-guard, e2e-asserts-guard, jest-mock-boundary-guard, broken-links-guard, test-count-docs-guard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next/
          retention-days: 7

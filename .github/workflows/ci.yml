name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Daily scheduled run so new npm advisories are caught between PRs (#1108)
  # and the Playwright flake-detector runs nightly (#1599). On the schedule
  # only the `security`/`cargo-audit` audits, the `flake-detector` (#1599),
  # and the `cross-browser-e2e` (#1595) jobs run; every other job is gated
  # with `if: github.event_name != 'schedule'` to skip this trigger.
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Run unit tests with coverage
        run: npm test -- --coverage --ci --maxWorkers=2 --forceExit --workerIdleMemoryLimit=512MB
      
      - name: QA coverage gate (#1394)
        run: node scripts/qa-coverage-gate.js
      
      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  
  e2e:
    name: E2E Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck]
    # Issue #1433: engage the Tauri dev-fallback shim so the desktop code
    # paths are taken against the dev server. The flag is a build-time
    # NEXT_PUBLIC_* value inlined by Next, so it must be present in the env
    # that boots `npm run dev` (Playwright's webServer inherits this env).
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium
      
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  flake-detector:
    # Issue #1264: nightly Playwright flake-detector. Runs the suite 5×
    # with `--retries=0` and fails if any spec passes <4/5. Posted as a
    # PR comment when flakes are found, so engineers see the signal
    # without browsing to the Actions tab. Slow (~30 min for the full
    # chromium suite × 5) so it runs nightly (#1599), on every push to
    # main, and on manual dispatch — never on PRs or develop pushes.
    name: Flake Detector (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Issue #1599: a half-finished flake run reports a false negative, so
    # never cancel an in-flight detector run — queue concurrent triggers
    # (nightly + push-to-main landing at the same time) instead.
    concurrency:
      group: ${{ github.workflow }}-flake-detector
      cancel-in-progress: false
    # Mirror the e2e job's Tauri dev-fallback flag (#1433) so the nightly
    # flake run exercises the same desktop path and doesn't false-positive.
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Run flake detector (5 runs, threshold 4)
        id: flake
        # Capture the exit code; an infra failure must still upload the
        # partial report so the PR comment is useful.
        run: |
          set +e
          npm run test:e2e:flake
          FLAKE_EXIT=$?
          echo "flake-exit=$FLAKE_EXIT" >> "$GITHUB_OUTPUT"
          exit $FLAKE_EXIT
        env:
          CI: 'true'

      - name: Upload flake report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-detector-report
          path: reports/flake-detector/
          retention-days: 90

      - name: Post PR comment with flake report
        if: github.event_name == 'schedule' && steps.flake.outputs.flake-exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Flakes concern the codebase, not a single PR — surface them on
        # every open PR that targets the default branch. Use a hidden
        # marker so re-runs do not duplicate the comment.
        run: |
          set -e
          if [ ! -f reports/flake-detector/report.md ]; then
            echo "No flake report present; skipping PR comment."
            exit 0
          fi
          BASE="${GITHUB_BASE_REF:-main}"
          for pr in $(gh pr list --state open --base "$BASE" --json number --jq '.[].number'); do
            gh pr comment "$pr" --body-file reports/flake-detector/report.md || true
          done
  
  cross-browser-e2e:
    # Issue #1595: nightly cross-browser E2E gate. playwright.config.ts
    # declares chromium/firefox/webkit, but the per-PR e2e job above runs
    # --project=chromium only, so firefox/webkit specs never executed and a
    # browser-specific divergence (focus behavior, ResizeObserver /
    # MutationObserver scheduling, webkit strict Intl locale handling)
    # regressed silently. This job mirrors the flake-detector nightly
    # pattern above: schedule + workflow_dispatch + push-to-main — never on
    # PRs, so per-PR CI keeps running ONLY --project=chromium (#1595
    # acceptance criterion 4: keeps PR CI under budget).
    #
    # Tolerance note (#1625): the E2E dev-server boot is currently broken in
    # CI, so this job is expected to fail until #1625 lands. Per #1595's
    # acceptance criterion 3 the run must exit non-zero on any firefox/webkit
    # spec failure, so there is deliberately NO continue-on-error here: the
    # job is nightly/manual-only and is not in the `build` job's needs list,
    # so the red run is a signal, not a merge blocker.
    name: Cross-Browser E2E (firefox + webkit)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Queue concurrent triggers (nightly + manual dispatch landing together)
    # instead of cancelling: a half-finished cross-browser run is still signal.
    concurrency:
      group: ${{ github.workflow }}-cross-browser-e2e
      cancel-in-progress: false
    # Mirror the e2e job's Tauri dev-fallback flag (#1433) so this run
    # exercises the same desktop code path as the per-PR chromium run.
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Distinct key prefix, NOT the `playwright-*` key the chromium e2e
          # job uses (#1595): that cache holds chromium only, so restoring it
          # here would mark a cache hit and skip the firefox/webkit install
          # below. Same lockfile-hash pattern, separate browser set.
          key: playwright-crossbrowser-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox webkit

      - name: Install Playwright OS dependencies
        # Unconditional twin of the cache-miss install above (same pattern as
        # the chromium e2e job): --with-deps only runs on a cache miss, so
        # this step keeps OS libs current when the browser cache is a hit.
        run: npx playwright install-deps firefox webkit

      - name: Run Playwright tests (firefox + webkit)
        id: crossbrowser
        env:
          CI: 'true'
          # JSON reporter output feeds the per-project summary table below;
          # HTML goes to the same folder the per-PR e2e job uploads.
          PLAYWRIGHT_JSON_OUTPUT_DIR: reports/cross-browser
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        # Capture the exit code so the summary/report steps below can run
        # `if: always()`, then re-exit non-zero: any firefox/webkit failure
        # must fail the workflow (#1595 acceptance criterion 3).
        run: |
          set +e
          mkdir -p reports/cross-browser
          npx playwright test --project=firefox --project=webkit --reporter=list,json,html
          CROSS_EXIT=$?
          echo "test-exit=$CROSS_EXIT" >> "$GITHUB_OUTPUT"
          exit "$CROSS_EXIT"

      - name: Per-project summary (#1595)
        if: always()
        run: |
          set -e
          python3 - <<'PY'
          import json, os

          results_path = "reports/cross-browser/results.json"
          buckets = ("passed", "failed", "flaky", "skipped")
          mapping = {"expected": "passed", "unexpected": "failed", "flaky": "flaky", "skipped": "skipped"}
          counts = {}

          def walk(suite):
              for spec in suite.get("specs") or []:
                  for test in spec.get("tests") or []:
                      yield test
              for child in suite.get("suites") or []:
                  yield from walk(child)

          try:
              with open(results_path, encoding="utf-8") as fh:
                  data = json.load(fh)
              for project_suite in data.get("suites") or []:
                  for test in walk(project_suite):
                      project = test.get("projectName") or "unknown"
                      status = mapping.get(test.get("status"), "failed")
                      row = counts.setdefault(project, {b: 0 for b in buckets})
                      row[status] = row.get(status, 0) + 1
          except (OSError, ValueError):
              counts = {}

          lines = ["### Cross-browser E2E (#1595) - per-project results", ""]
          if counts:
              lines.append("| Project | Passed | Failed | Flaky | Skipped |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for project in sorted(counts):
                  row = counts[project]
                  values = (row.get(b, 0) for b in buckets)
                  lines.append("| {} | {} | {} | {} | {} |".format(project, *values))
          else:
              lines.append("_No per-project report was produced - the run failed before any test")
              lines.append("completed (e.g. the dev-server boot failure tracked in #1625). Check the job log._")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-firefox-webkit
          path: |
            playwright-report/
            reports/cross-browser/
          retention-days: 30

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots-firefox-webkit
          path: test-results/
          retention-days: 7

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run ESLint
        run: npm run lint

  a11y-contrast:
    name: A11y Color Contrast
    # WCAG 1.4.3 / 1.4.11 design-token audit (#1268). Runs scripts/check-color-contrast.ts
    # which parses `src/app/globals.css`, computes WCAG contrast ratios for every
    # documented foreground/background pair, and fails the build if any pair drops
    # below the AA threshold. Also regenerates docs/CONTRAST_AUDIT.md and uploads
    # it as a workflow artifact so reviewers can read the latest numbers without
    # checking out the branch.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Audit design-token contrast (WCAG 1.4.3 / 1.4.11)
        run: npm run a11y:contrast:report

      - name: Upload contrast audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-audit-report
          path: docs/CONTRAST_AUDIT.md
          retention-days: 30
  
  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Run TypeScript type check
        run: npm run typecheck

  commitlint:
    name: Commit Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: npx commitlint --last --verbose

  mutation-test:
    # Mutation-score gate for the rules-engine invariants (#1265). Runs Stryker
    # against `src/lib/game-state/layer-system.ts` on every PR and surfaces a
    # per-pass threshold of 70% (see stryker.config.js `thresholds.break`). The
    # full allowlist (layer-system, replacement-effects, spell-casting) runs
    # nightly in .github/workflows/mutation.yml — too slow for per-PR CI.
    #
    # `build` depends on this job so a regression below the threshold blocks
    # the merge, mirroring how `coverageThreshold` gates the `test` job.
    name: Mutation Test (layer-system)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run Stryker (layer-system only)
        # Per-file scope keeps the PR gate to a single module (~15-20 min on a
        # 2-core runner). The full allowlist (3 modules) runs on the nightly
        # schedule — see .github/workflows/mutation.yml.
        run: npm run mutate:layer-system
        env:
          STRYKER_CONCURRENCY: 4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-layer-system
          path: reports/mutation/
          retention-days: 30

      - name: Per-module score breakdown
        # Issue #1549: this job previously stopped at the artifact upload, so
        # a layer-system regression below `thresholds.break` surfaced only as a
        # bare Stryker exit code plus a 30-day artifact a maintainer had to
        # download and unzip. Run the same summary step the nightly workflow
        # has had since #1395 so the per-module table (score / killed /
        # survived / no-coverage, plus the #1598 BELOW FLOOR marker) renders
        # inline on the PR's Actions summary. `if: always()` keeps the table
        # visible even when Stryker itself fails; when the report is missing
        # the script exits 0 with a skip note, so this step can never turn a
        # passing run into a failing one.
        if: always()
        run: node scripts/mutation-summary.js

  security:
    name: Security Audit (npm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run npm audit
        # Fail on high/critical advisories. Previously `critical`, which let
        # every high/moderate advisory pass CI silently (#1108).
        run: npm audit --audit-level=high

  # Mirror of the `security` job for the Rust crate tree consumed by the Tauri
  # host at `src-tauri/`. Tauri 2 desktop bundles statically link Rust crates,
  # so CVEs in any of them ship into the installer. Resolves #1275.
  cargo-audit:
    name: Security Audit (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Configure git
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit install
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-v0.22

      - name: Install cargo-audit
        # `--locked` makes the toolchain installer pick the exact version
        # referenced in cargo-audit's own Cargo.toml, matching the homebrew
        # release that the docs runbook recommends.
        run: cargo install cargo-audit --locked --version ^0.22 --force

      - name: Run cargo audit
        working-directory: src-tauri
        # `cargo audit` exits non-zero if RustSec advisories with a recognised
        # severity are found. Warnings (unmaintained/unsound/notice) are
        # surfaced but ignored here so the inherited gtk-rs GTK3 binders,
        # which Tauri pulls in via `wry` on Linux, do not break the build
        # until the gtk4-rs migration tracked in the roadmap lands.
        # See docs/RUST_UPGRADE_STRATEGY.md for triage details.
        run: |
          set -e
          cargo audit --json > cargo-audit.json || AUDIT_EXIT=$?
          set -e
          python3 - <<'PY'
          import json, sys
          with open('cargo-audit.json') as fh:
              data = json.load(fh)
          vulns = data.get('vulnerabilities', {}).get('list', []) or []
          order = {'low': 1, 'moderate': 2, 'medium': 2, 'high': 3, 'critical': 4}
          threshold = order['high']
          failing = []
          for v in vulns:
              sev = (v.get('advisory') or {}).get('severity') or ''
              pkg = (v.get('package') or {}).get('name')
              ver = (v.get('package') or {}).get('version')
              aid = (v.get('advisory') or {}).get('id')
              title = (v.get('advisory') or {}).get('title')
              if order.get(sev, 0) >= threshold:
                  failing.append(f"  {aid}: {pkg}@{ver} [{sev}] {title}")
          if failing:
              print("cargo audit: failing advisories (severity >= high):", file=sys.stderr)
              for line in failing:
                  print(line, file=sys.stderr)
              sys.exit(1)
          print(f"cargo audit: {len(vulns)} advisories total; none at severity >= high")
          warnings = data.get('warnings') or {}
          for kind, items in warnings.items():
              print(f"  warning [{kind}]: {len(items)} (informational, not gated)")
          PY
          # Surface cargo-audit's own exit code if the JSON path succeeded
          # but the binary itself reported an error.
          if [ "${AUDIT_EXIT:-0}" -ne 0 ]; then
              echo "cargo audit exited with status ${AUDIT_EXIT}; see cargo-audit.json"
              exit "${AUDIT_EXIT}"
          fi

      - name: Upload cargo-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-audit-report
          path: src-tauri/cargo-audit.json
          retention-days: 14

  # Issue #1591: fmt/clippy/test gate for the src-tauri/ Rust crate. The
  # cargo-audit job above only checks RustSec advisories; this job enforces
  # rustfmt formatting, clippy lints (`-D warnings` escalates every warning
  # to an error), and runs the Rust unit tests — including the
  # single-instance regression guard for issue #1441
  # (`single_instance_plugin_initializes_with_main_window_callback`) that
  # previously never executed in CI. Node is bootstrapped via the shared
  # composite so `npm run build` can produce the `.next` frontend dist that
  # `tauri::generate_context!()` embeds at compile time; without it both
  # clippy and test fail to compile the crate.
  rust-checks:
    name: Rust Checks (fmt, clippy, test)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Build Next.js frontend
        # tauri.conf.json sets `build.frontendDist: ../.next`, and
        # `tauri::generate_context!()` (src-tauri/src/lib.rs) embeds those
        # assets while compiling — the directory must exist for clippy and
        # test to build the crate at all.
        run: npm run build

      - name: Install Rust toolchain
        # Same action as the cargo-audit job above; adds the rustfmt and
        # clippy components this gate needs.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: rust-checks-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-checks-${{ runner.os }}-

      - name: Install Linux system dependencies
        # Same webkit/gtk dev-lib list as the Linux build job in
        # release.yml — clippy/test must link the Tauri host to compile it.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxtst-dev \
            libatk1.0-dev \
            libasound2-dev \
            libatspi2.0-dev \
            libcups2-dev

      - name: Check formatting (cargo fmt)
        # Runs first — no compilation or system deps needed, so formatting
        # drift fails fast before the expensive steps.
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint (cargo clippy, warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (cargo test)
        working-directory: src-tauri
        run: cargo test --no-fail-fast

  workflow-lint:
    # Issue #1481: standalone Workflow Lint job. Lands independently of #1438
    # so the four pre-existing workflow issues (SC2034 dead var, undeclared
    # `video-fixtures-count` output, SC2086/SC2015 info-level noise) keep
    # being caught even if the broader #1438 CI refactor is reverted.
    # actionlint ships as a single Go binary — no Node setup required.
    # shellcheck severity threshold is set to `warning` so info-level noise
    # (SC2086 double-quote-to-prevent-globbing, SC2015 `A && B || C`) does
    # not fail the build, but real warnings do.
    name: Workflow Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Issue #1550: assert that every `uses: ./.github/actions/setup-node-npm-ci`
      # caller either omits `with: node-version:` (relies on the composite
      # default '22') or specifies `'22'` (or `${{ env.NAME }}` where env.NAME
      # is `'22'` in the same file). Runs as a plain-Node script (~50ms) so
      # no Node setup step is needed — the `setup-node-npm-ci` composite
      # itself depends on this guard, so it must not be a setup step here.
      - name: Assert setup-node-npm-ci node-version consistency (#1550)
        run: node scripts/check-setup-node-npm-ci-version.mjs

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        with:
          # actionlint has no severity flag; use -ignore (regex on messages)
          # to keep SC2086 (quote vars) / SC2015 (A&&B||C) info-level nits
          # informational rather than failing the PR gate.
          args: '-ignore SC2086 -ignore SC2015'

  tauri-updater-config:
    # Issue #1430: standalone guard that prevents the Tauri 2 updater from
    # ever shipping with the empty-pubkey MITM default. The Jest suite
    # `tests/updater-wiring.test.ts` (#1403) covers the same contracts but
    # runs inside the full unit-test job; this script runs in plain Node
    # (~50ms) so a regression against `src-tauri/tauri.conf.json` fails
    # fast in its own job rather than waiting on the test suite.
    name: Tauri Updater Config Guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Assert updater config (#1430)
        run: node scripts/check-tauri-updater-config.mjs

  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck, commitlint, mutation-test, security, cargo-audit, rust-checks, a11y-contrast, e2e, workflow-lint, tauri-updater-config]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next/
          retention-days: 7

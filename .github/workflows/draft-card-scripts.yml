# Drafts card scripts for one Standard set with an LLM and opens a draft PR
# for review (#2491). Needs a repo secret ANTHROPIC_API_KEY or OPENAI_API_KEY.
# PRs opened with GITHUB_TOKEN don't trigger CI: push a commit (or close and
# reopen) before review so the required checks run.
name: Draft card scripts

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Scryfall set code (e.g. dsk)"
        required: true
      provider:
        description: "anthropic or openai"
        required: true
        default: anthropic
      model:
        description: "Model id for the provider"
        required: true
      limit:
        description: "Max cards to draft"
        required: false
        default: "200"

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    # Spends the owner's API credit: only anchapin may start or re-run it.
    if: github.triggering_actor == 'anchapin' && github.actor == 'anchapin'
    # API keys live in this environment, which only main can use.
    environment: llm-spend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draft scripts
        env:
          DRAFT_LLM_PROVIDER: ${{ inputs.provider }}
          DRAFT_LLM_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/draft-card-scripts.ts --set "${{ inputs.set }}" --limit "${{ inputs.limit }}"
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
        run: |
          branch="card-scripts/drafts-${SET}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/lib/game-state/card-scripts/cards docs/card-scripts/drafts
          git commit -m "feat(card-scripts): LLM-drafted scripts for ${SET^^} (#2491)"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "card-scripts: LLM drafts for ${SET^^}" \
            --body-file "docs/card-scripts/drafts/${SET,,}.md"

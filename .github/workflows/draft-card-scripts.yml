# Drafts card scripts for one Standard set with an LLM and opens a draft PR
# for review (#2491). The default, picked by the bake-off (#2514), is one
# Gemini Batch API job with gemini-3.1-flash-lite (GEMINI_API_KEY). anthropic
# and openai need ANTHROPIC_API_KEY / OPENAI_API_KEY. Keys live in the
# llm-spend environment.
# PRs opened with GITHUB_TOKEN don't trigger CI: push a commit (or close and
# reopen) before review so the required checks run.
name: Draft card scripts

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Scryfall set code (e.g. dsk)"
        required: true
      provider:
        description: "gemini-batch, anthropic or openai"
        required: true
        default: gemini-batch
      model:
        description: "Model id for the provider"
        required: true
        default: gemini-3.1-flash-lite
      limit:
        description: "Max cards to draft"
        required: false
        default: "400"
      gemini_batch:
        description: "Resume a Gemini batch (batches/...) that outlived the timeout; same set and limit"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    # Spends the owner's API credit: only anchapin may start or re-run it.
    if: github.triggering_actor == 'anchapin' && github.actor == 'anchapin'
    # API keys live in this environment, which only main can use.
    environment: llm-spend
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draft scripts
        env:
          DRAFT_LLM_PROVIDER: ${{ inputs.provider }}
          DRAFT_LLM_MODEL: ${{ inputs.model }}
          DRAFT_GEMINI_BATCH: ${{ inputs.gemini_batch }}
          DRAFT_GEMINI_TIMEOUT_MIN: "160"
          SET: ${{ inputs.set }}
          LIMIT: ${{ inputs.limit }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/draft-card-scripts.ts --set "$SET" --limit "$LIMIT"
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
        run: |
          branch="card-scripts/drafts-${SET}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/lib/game-state/card-scripts/cards docs/card-scripts/drafts
          git commit -m "feat(card-scripts): LLM-drafted scripts for ${SET^^} (#2491)"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "card-scripts: LLM drafts for ${SET^^}" \
            --body-file "docs/card-scripts/drafts/${SET,,}.md"

name: Nightly

# Issue #2365: the cross-browser E2E gate used to live in `.github/workflows/ci.yml`
# as the `Cross-Browser E2E (firefox + webkit)` job. It only ever ran on the
# nightly schedule, on manual dispatch, and on pushes to `main` — so its first
# signal landed *after* the merge, and every red cross-browser run painted the
# default branch's CI suite red (main reads chronically red).
#
# The job now lives here, in a dedicated nightly workflow, with its triggers
# preserved (schedule + workflow_dispatch + push to `main`). `ci.yml` therefore
# no longer contains a job that can turn the default branch red for reasons
# unrelated to the change under test, while the cross-browser signal itself is
# unchanged: same steps, same firefox + webkit matrix, same reports.
#
# Per-PR CI stays chromium-only (#1595): the full firefox + webkit matrix is
# too expensive to run on every PR, so it is deliberately NOT triggered here.

on:
  # Same cron as the `schedule` trigger in ci.yml, so the nightly cross-browser
  # run keeps its existing timing.
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cross-browser-e2e:
    # Issue #1595: nightly cross-browser E2E gate. playwright.config.ts
    # declares chromium/firefox/webkit, but the per-PR e2e job in ci.yml runs
    # --project=chromium only, so firefox/webkit specs never executed and a
    # browser-specific divergence (focus behavior, ResizeObserver /
    # MutationObserver scheduling, webkit strict Intl locale handling)
    # regressed silently. This job mirrors the flake-detector nightly
    # pattern in ci.yml: schedule + workflow_dispatch + push-to-main — never on
    # PRs, so per-PR CI keeps running ONLY --project=chromium (#1595
    # acceptance criterion 4: keeps PR CI under budget).
    #
    # Tolerance note: the E2E dev-server boot breakage tracked by #1625 is
    # resolved, and the #1705 engine mix-up (firefox/webkit projects
    # defaulting to chromium and demanding `chromium_headless_shell`, which
    # this job does not install) is fixed via `browserName` in
    # playwright.config.ts. Per #1595's acceptance criterion 3 the run must
    # exit non-zero on any firefox/webkit spec failure, so there is
    # deliberately NO continue-on-error here: the job is nightly/manual-only
    # and is not in the `build` job's needs list, so a red run is a signal,
    # not a merge blocker.
    name: Cross-Browser E2E (firefox + webkit)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Queue concurrent triggers (nightly + manual dispatch landing together)
    # instead of cancelling: a half-finished cross-browser run is still signal.
    concurrency:
      group: ${{ github.workflow }}-cross-browser-e2e
      cancel-in-progress: false
    # Mirror the e2e job's Tauri dev-fallback flag (#1433) so this run
    # exercises the same desktop code path as the per-PR chromium run.
    env:
      NEXT_PUBLIC_TAURI_FALLBACK: '1'
      NEXT_DISABLE_DEV_OVERLAY: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Free disk space (remove npm cache and large artifacts)
        run: |
          # Issue #2067: GitHub-hosted runners can run out of disk space on heavy CI runs.
          echo "--- disk space before ---"
          df -h .
          echo "--- largest directories ---"
          # shellcheck disable=SC2035  # */ glob matches dirs with dashes; this script intentionally lists all
          du -sh . */ 2>/dev/null | sort -hr | head -15
          # Remove npm cache (setup-node-npm-ci re-creates it)
          npm cache clean --force 2>/dev/null || true
          # Remove any stale node_modules from previous failed runs (if any)
          rm -rf ./node_modules
          # Remove Tauri build artifacts (not needed for E2E - Playwright tests run against the Next.js dev server)
          rm -rf ./src-tauri/target
          # Remove Rust target cache
          rm -rf ~/.cargo/registry/cache 2>/dev/null || true
          rm -rf ~/.cargo/git 2>/dev/null || true

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Distinct key prefix, NOT the `playwright-*` key the chromium e2e
          # job uses (#1595): that cache holds chromium only, so restoring it
          # here would mark a cache hit and skip the firefox/webkit install
          # below. Same lockfile-hash pattern, separate browser set.
          key: playwright-crossbrowser-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # #1705: this run executes ONLY the firefox and webkit projects
        # (playwright.config.ts pins their `browserName`), so firefox +
        # webkit + ffmpeg (auto-included for any browser argument) is the
        # complete binary set. chromium and chromium_headless_shell are
        # deliberately NOT installed: if a future config/fixture regresses
        # to the default chromium engine, the run must fail loudly here
        # with `Executable doesn't exist ... chromium_headless_shell`
        # instead of silently testing chromium a second time.
        run: npx playwright install --with-deps firefox webkit

      - name: Install Playwright OS dependencies
        # Unconditional twin of the cache-miss install above (same pattern as
        # the chromium e2e job): --with-deps only runs on a cache miss, so
        # this step keeps OS libs current when the browser cache is a hit.
        run: npx playwright install-deps firefox webkit

      - name: Run Playwright tests (firefox + webkit)
        id: crossbrowser
        env:
          CI: 'true'
          # JSON reporter output feeds the per-project summary table below;
          # HTML goes to the same folder the per-PR e2e job uploads.
          PLAYWRIGHT_JSON_OUTPUT_DIR: reports/cross-browser
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        # Capture the exit code so the summary/report steps below can run
        # `if: always()`, then re-exit non-zero: any firefox/webkit failure
        # must fail the workflow (#1595 acceptance criterion 3).
        run: |
          set +e
          mkdir -p reports/cross-browser
          npx playwright test --project=firefox --project=webkit --reporter=list,json,html
          CROSS_EXIT=$?
          echo "test-exit=$CROSS_EXIT" >> "$GITHUB_OUTPUT"
          exit "$CROSS_EXIT"

      - name: Per-project summary (#1595)
        if: always()
        run: |
          set -e
          python3 - <<'PY'
          import json, os

          results_path = "reports/cross-browser/results.json"
          buckets = ("passed", "failed", "flaky", "skipped")
          mapping = {"expected": "passed", "unexpected": "failed", "flaky": "flaky", "skipped": "skipped"}
          counts = {}

          def walk(suite):
              for spec in suite.get("specs") or []:
                  for test in spec.get("tests") or []:
                      yield test
              for child in suite.get("suites") or []:
                  yield from walk(child)

          try:
              with open(results_path, encoding="utf-8") as fh:
                  data = json.load(fh)
              for project_suite in data.get("suites") or []:
                  for test in walk(project_suite):
                      project = test.get("projectName") or "unknown"
                      status = mapping.get(test.get("status"), "failed")
                      row = counts.setdefault(project, {b: 0 for b in buckets})
                      row[status] = row.get(status, 0) + 1
          except (OSError, ValueError):
              counts = {}

          lines = ["### Cross-browser E2E (#1595) - per-project results", ""]
          if counts:
              lines.append("| Project | Passed | Failed | Flaky | Skipped |")
              lines.append("| --- | ---: | ---: | ---: | ---: |")
              for project in sorted(counts):
                  row = counts[project]
                  values = (row.get(b, 0) for b in buckets)
                  lines.append("| {} | {} | {} | {} | {} |".format(project, *values))
          else:
              lines.append("_No per-project report was produced - the run failed before any test")
              lines.append("completed (e.g. the dev-server boot failure tracked in #1625). Check the job log._")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-firefox-webkit
          path: |
            playwright-report/
            reports/cross-browser/
          retention-days: 30

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots-firefox-webkit
          path: test-results/
          retention-days: 7

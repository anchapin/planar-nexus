name: tmp fix test count docs

on:
  workflow_dispatch:
  push:
    branches:
      - feat/schema-v4-mirror

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schema-v4-mirror

      - name: Bump test-count doc numbers to live Jest (15354 passed, 5 skipped, 15359 total)
        run: |
          python3 - <<'PY'
          import sys

          def patch(path, old, new):
              s = open(path, encoding="utf-8").read()
              n = s.count(old)
              if n == 1:
                  open(path, "w", encoding="utf-8").write(s.replace(old, new))
                  print(path, "patched")
              elif s.count(new) >= 1:
                  print(path, "already patched")
              else:
                  print(path, "EXPECTED STRING NOT FOUND (count=%d), aborting" % n)
                  sys.exit(1)

          patch(
              "docs/TEST_VIDEO_FIXTURES.md",
              "15353 passed, 5 skipped, 15358 total",
              "15354 passed, 5 skipped, 15359 total",
          )
          patch(
              "docs/onboarding.md",
              "15358 (15353 passed + 5 skipped)",
              "15359 (15354 passed + 5 skipped)",
          )
          PY

      - name: Commit doc bump
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "Fo (Wajo)"
          git config user.email "fo@wajo.ai"
          git add docs/TEST_VIDEO_FIXTURES.md docs/onboarding.md
          git commit -m "docs: ratchet test-count block to 15354 passed / 15359 total"
          git push origin feat/schema-v4-mirror

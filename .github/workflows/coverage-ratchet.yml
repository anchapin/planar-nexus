# Issue #1596: auto-ratchet the Jest coverage floor on every merge to main.
#
# scripts/ratchet-coverage.js (issue #1099) rewrites jest.config.js
# `coverageThreshold.global` upward to floor(measured - margin) and refuses to
# lower it (exit 1 on regression). Until now it only ran when a human typed
# `npm run test:coverage:ratchet`; this workflow closes the loop so every PR
# that adds tests permanently moves the floor toward the documented 70% target
# (docs/TESTING.md). The per-PR `test` job in ci.yml still catches coverage
# removals at review time; this job makes the gains sticky post-merge.
#
# Loop safety (independent guards, so the bot can never feed itself):
#   1. Pushes made with the built-in GITHUB_TOKEN never trigger new workflow
#      runs (GitHub's built-in recursion protection).
#   2. The job-level `if` skips pushes authored by github-actions[bot] —
#      which includes the auto-merge squash commit of the ratchet PR
#      itself (issue #1850-followup landing flow).
#
# Issue #1835: NO CI ran on a directly-pushed ratchet commit, so this
# workflow asserts its own consistency before pushing — the same
# coverage-docs guard ci.yml runs on PRs (`scripts/check-coverage-docs-sync.mjs`)
# — and commits the ratcheted doc tables (README/CONTRIBUTING/TESTING) in the
# SAME commit as the jest.config.js bump. Previously only jest.config.js was
# staged, so the tables the ratchet script had just rewritten were silently
# discarded and the next PR failed Coverage Docs Guard on the drift.
#
# Issue #1850-followup: landing via PR instead of a direct `git push` to main.
# Branch protection on main requires the 17 status checks, which a direct
# GITHUB_TOKEN push can never satisfy (GH006: "Protected branch update
# failed"; the bot is not an admin, so enforce_admins=false does not exempt
# it). The bump now lands through an auto-merge PR: the required checks run
# on the PR (which also retires the `[skip ci]` guard — the PR merge commit
# is bot-authored, so job-level guard 3 still prevents re-ratchet loops).
# A second open ratchet PR suppresses duplicates until the first lands; the
# next push to main re-ratchets from the merged floor.
#
# Concurrency: queued, never cancelled — two rapid merges to main must both
# ratchet (the second run sees the first bump's floor as its baseline).
name: Coverage Ratchet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The ratchet lands the bumped jest.config.js through an auto-merge PR using
# the built-in GITHUB_TOKEN (issue #1850-followup: direct pushes to the
# protected main branch are rejected with GH006 because the bot can never
# satisfy required status checks). Scoped here rather than on ci.yml so the
# write permission never reaches the per-PR CI jobs.
permissions:
  contents: write
  pull-requests: write

jobs:
  ratchet:
    name: Ratchet coverage floor
    # Loop guard: skip bot-authored pushes and `[skip ci]` head commits.
    # workflow_dispatch is always allowed (operator-initiated validation).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        github.event.head_commit.committer.username != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      # Issue #1704: the local composite below cannot be resolved until the
      # repository exists in the workspace — check out first, mirroring the
      # bootstrap order every job in ci.yml uses (the composite then re-runs
      # its own internal checkout, which is harmless and idempotent).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-node-npm-ci

      - name: Run unit tests with coverage
        # Same invocation as the CI `test` job so the measured numbers match;
        # jest.config.js enables the `json-summary` reporter that feeds the
        # ratchet (coverage/coverage-summary.json). Jest fails before the
        # ratchet step if coverage is already below the current floor.
        # Issue #1719: no --forceExit, aligned with the ci.yml Test job — a
        # hanging timer must fail this run, not be masked.
        run: npm test -- --coverage --ci --maxWorkers=2 --workerIdleMemoryLimit=512MB

      - name: Ratchet coverage floor
        id: ratchet
        # Exit codes: 0 = at floor or bumped, 1 = regression (the floor is
        # never lowered). On regression, re-emit each regressed metric line
        # as a GitHub error annotation (#1596 acceptance criterion 3); the
        # script's per-metric lines look like
        # `  branches    measured 27.5% < floor 28% (-0.5)`.
        run: |
          set -e
          set +e
          node scripts/ratchet-coverage.js 2> "$RUNNER_TEMP/ratchet-stderr.log"
          RATCHET_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/ratchet-stderr.log" >&2
          if [ "$RATCHET_EXIT" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"measured"*"floor"*) echo "::error::Coverage floor regression — ${line}" ;;
              esac
            done < "$RUNNER_TEMP/ratchet-stderr.log"
            echo "::error::Coverage regression on main (ratchet exit ${RATCHET_EXIT}): measured coverage is below the jest.config.js floor. The floor is never lowered — restore coverage above the floor."
          fi
          exit "$RATCHET_EXIT"

      - name: Assert coverage-docs consistency (issue #1835)
        # Fail fast in-workflow BEFORE the ratchet PR is opened: if the
        # ratchet rewrote jest.config.js but left any anchored doc table
        # stale, this catches it here (the PR's own Coverage Docs Guard
        # would also catch it, but only after a full CI cycle). Also covers
        # the noop path (guard passes trivially when nothing was rewritten).
        run: node scripts/check-coverage-docs-sync.mjs

      - name: Detect ratchet change
        id: changed
        run: |
          set -e
          if git diff --quiet -- jest.config.js README.md CONTRIBUTING.md docs/TESTING.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[ratchet] jest.config.js already at the measured floor — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[ratchet] jest.config.js coverageThreshold.global bumped:"
            git --no-pager diff -- jest.config.js README.md CONTRIBUTING.md docs/TESTING.md
          fi

      - name: Open ratchet PR (auto-merge)
        if: steps.changed.outputs.changed == 'true'
        env:
          WORKFLOW_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::notice::Manual run on non-main ref ($WORKFLOW_REF) — jest.config.js rewritten in the workspace only, not pushed."
            exit 0
          fi
          # Duplicate suppression: if a previous ratchet PR is still open
          # (its required checks still running), don't stack a conflicting
          # second PR — the next push to main re-ratchets from the merged
          # floor once it lands.
          OPEN_RATCHET_PRS=$(gh pr list --state open \
            --search "in:title chore: auto-ratchet jest coverage floor" \
            --json number --jq 'length')
          if [ "$OPEN_RATCHET_PRS" -gt 0 ]; then
            echo "::notice::An auto-ratchet PR is already open — skipping duplicate (it will land via auto-merge)."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/auto-ratchet-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          # Issue #1835: stage the doc tables too — the ratchet script
          # rewrites them alongside jest.config.js, and they must land in the
          # SAME commit as the bump or main drifts doc-inconsistent (the
          # original bug: only jest.config.js was staged, silently discarding
          # the rewritten tables).
          git add jest.config.js README.md CONTRIBUTING.md docs/TESTING.md
          # No `[skip ci]`: the PR's own required checks must run to gate the
          # auto-merge. Loop safety is preserved by the job-level `if`
          # (guard 3): the squash-merge commit is authored by
          # github-actions[bot], so the merged bump never re-triggers this
          # workflow. GITHUB_TOKEN branch pushes don't trigger workflows
          # (guard 1), and this workflow's `on` only fires on main pushes.
          git commit -m "chore: auto-ratchet jest coverage floor to measured value"
          git push origin "$BRANCH"
      - name: Setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: chore/auto-ratchet-${{ github.run_id }}
          title: "chore: auto-ratchet jest coverage floor"
          body: "Automated coverage-floor bump from the Coverage Ratchet workflow (run ${{ github.run_id }} on ${GITHUB_SHA:0:7}). Commits jest.config.js + the README/CONTRIBUTING/TESTING doc tables atomically — the issue #1835 consistency guard (scripts/check-coverage-docs-sync.mjs) already passed in-workflow. Auto-merge is enabled; the PR lands when the required checks finish green."

      - name: Merge PR
        run: gh pr merge --auto --squash --delete-branch

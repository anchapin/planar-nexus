name: Setup Node with npm ci
description: Configure git, check out the repository, install Node.js, and run npm ci.

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: false
    default: '22'
  fetch-depth:
    description: Git fetch depth passed to actions/checkout.
    required: false
    default: '1'
  npm-ci-args:
    description: Additional arguments appended to npm ci.
    required: false
    default: ''

outputs:
  node-modules-cache-key:
    description: Cache key for downstream node_modules consumers.
    value: ${{ steps.cache-key.outputs.value }}

runs:
  using: composite
  steps:
    - name: Configure git
      shell: bash
      run: git config --global --add safe.directory '*'

    - name: Free disk space (before cache restore)
      # Issue #2255: GitHub-hosted runners exhaust disk during cache restoration
      # (actions/setup-node npm cache, and the package-lock.json cache).
      # Clean up BEFORE setup-node so there is room to extract caches.
      shell: bash
      run: |
        df -h .
        rm -rf ~/.npm 2>/dev/null || true
        rm -rf ~/.cache 2>/dev/null || true
        rm -rf /tmp/* 2>/dev/null || true
        rm -rf /root/.npm 2>/dev/null || true
        rm -rf /root/.cache 2>/dev/null || true
        rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
        rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
        rm -rf /usr/local/share/boost 2>/dev/null || true
        rm -rf ~/Library/Logs 2>/dev/null || true
        rm -rf "$LOCALAPPDATA" 2>/dev/null || true
        echo "--- disk space after cleanup ---"
        df -h .

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Compute node_modules cache key
      id: cache-key
      shell: bash
      run: echo "value=${{ runner.os }}-node-${{ inputs.node-version }}-npm-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

    - name: Verify package-lock.json exists
      # Issue #2067: GitHub-hosted runners can hit disk-space exhaustion that
      # causes `actions/checkout` to silently fail to extract some files, so
      # `package-lock.json` is absent when `npm ci` runs and npm reports
      # "EUSAGE: package-lock.json not found".  This check gives a clear error
      # before npm ci rather than a cryptic usage error, and also handles the
      # recovery path where we re-checkout just the lock file.
      shell: bash
      run: |
        if [ ! -f package-lock.json ]; then
          echo "::warning::package-lock.json not found after checkout. Attempting to recover..."
          git checkout HEAD -- package-lock.json
          if [ ! -f package-lock.json ]; then
            echo "::error::Failed to recover package-lock.json. Disk space may be exhausted."
            echo "--- disk space ---"
            df -h .
            echo "--- listing project root ---"
            ls -la
            exit 1
          fi
          echo "::notice::package-lock.json recovered successfully."
        fi

    - name: Clear npm cache
      # Defensive: ensure a clean cache state.  A corrupted npm cache can cause
      # intermittent "package-lock.json not found" errors when the cache
      # metadata points to stale/missing lock-file entries.
      shell: bash
      run: npm cache clean --force

    - name: Install dependencies
      # Issue #1837: GitHub-hosted runners intermittently hit npm-registry
      # network errors (ETIMEDOUT/ENETUNREACH/ECONNRESET) during npm ci.
      # Retry those transient failures (2 retries, 10s/30s backoff) before
      # letting the job go red; any other failure fails immediately with
      # npm's original output and exit code.  The disk-space / lock-file check
      # above handles the "package-lock.json not found" case (issue #2067).
      shell: bash
      env:
        npm_config_fetch_retries: '5'
        npm_config_fetch_retry_mintimeout: '10000'
        npm_config_fetch_retry_maxtimeout: '60000'
      run: |
        network_error_re='ETIMEDOUT|ENETUNREACH|ECONNRESET|network timeout|EAI_AGAIN'
        max_attempts=3
        backoffs=(10 30)
        log="$(mktemp)"
        trap 'rm -f "$log"' EXIT

        attempt=1
        while [ "$attempt" -le "$max_attempts" ]; do
          set +e
          npm ci ${{ inputs.npm-ci-args }} >"$log" 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            cat "$log"
            exit 0
          fi

          if [ "$attempt" -lt "$max_attempts" ] && grep -Eq "$network_error_re" "$log"; then
            error_code="$(grep -Eo "$network_error_re" "$log" | head -n 1)"
            echo "::notice title=npm-ci-retry::attempt ${attempt} failed with network error (${error_code}); retrying in ${backoffs[$((attempt - 1))]}s [npm-ci-retry]"
            sleep "${backoffs[$((attempt - 1))]}"
            attempt=$((attempt + 1))
            continue
          fi

          cat "$log"
          exit "$status"
        done
